name: Build Chasten Reel

# The Moment: one story, one creature or element, one continuous shot with its
# own sound, the verse read over it. Spends only on steps that passed a gate,
# under a hard cap per story. See tools/reels/moment_build.py.
on:
  schedule:
    - cron: "0 16 * * 1,3,5"   # 11:00 America/Chicago in daylight time; 17 after Nov 1
  workflow_dispatch:
    inputs:
      story:
        description: "Shot card title to build (blank = next in the queue)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: reel-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow numpy
          ffmpeg -version | head -1

      - name: Target date
        id: d
        run: echo "day=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"

      # Takes cost real money. A retry reuses what was already bought.
      - name: Restore work in progress
        uses: actions/cache/restore@v4
        with:
          path: .reelwork
          key: reelwork-${{ steps.d.outputs.day }}

      - name: Build the Moment
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CHASTEN_STORY: ${{ inputs.story }}
        run: python tools/reels/moment_build.py

      - name: Save work in progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .reelwork
          key: reelwork-${{ steps.d.outputs.day }}

      - name: Prune reels older than 30 days
        if: always()
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          for d in reels/*/; do
            name=$(basename "$d")
            case "$name" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                if [[ "$name" < "$cutoff" ]] && [ -f "$d/reel.mp4" ]; then git rm -q "$d/reel.mp4"; fi ;;
            esac
          done

      # Runs even when the build shelved the story, so the pointer and the
      # shelved notice reach the repo and Slack hears about it.
      - name: Commit
        if: always()
        run: |
          git config user.name "Chasten Bot"
          git config user.email "ricardo@chasten.ai"
          git add reels studio/state
          git commit -q -m "Reel for ${{ steps.d.outputs.day }}" || echo "nothing to commit"
          git pull -q --rebase origin main && git push -q origin main
